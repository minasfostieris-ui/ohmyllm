name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      NO_COLOR: "1"
      TERM: xterm-256color
      OMLLM_CAMPAIGN_DIR: ${{ runner.temp }}/campaign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        if: matrix.os == 'ubuntu-latest'
        run: ruff check src tests scripts
      - name: Types (mypy)
        if: matrix.os == 'ubuntu-latest'
        run: mypy src/ohmyllm
      - name: Unit + integration tests
        run: python -m pytest tests/ -q
      - name: TUI smoke
        run: python scripts/tui_smoke.py
      - name: End-to-end check
        run: python scripts/e2e_check.py

  campaign:
    name: 2000-scenario visual campaign (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      TERM: xterm-256color
      OMLLM_CAMPAIGN_DIR: ${{ runner.temp }}/campaign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run campaign (asserts layout, colors, growth, no leaks on 2000 rendered screens)
        run: python scripts/preview_campaign.py 2000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-svgs-${{ matrix.os }}
          path: ${{ runner.temp }}/campaign/imgs/
          compression-level: 9
          retention-days: 14

  package:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Clean-install the wheel and smoke the entrypoints
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/oml --help
          /tmp/fresh/bin/ohmyllm --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
