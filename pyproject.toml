[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmyllm"
version = "0.1.0"
description = "OhMyLLM - local-first, privacy-respecting agentic AI platform for Ollama and LM Studio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Minas" }]
keywords = ["local-llm", "agents", "ollama", "lm-studio", "tui", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.86",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
vision = ["Pillow>=10"]  # crisper probe images + real previews; probe works without it
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ohmyllm = "ohmyllm.cli:app_entry"
omllm = "ohmyllm.cli:app_entry"
oml = "ohmyllm.cli:app_entry"
OMLLM = "ohmyllm.cli:app_entry"
OML = "ohmyllm.cli:app_entry"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ohmyllm = ["gui_static/*.html", "gui_static/*.css", "gui_static/*.js"]
"ohmyllm.tui" = ["*.tcss"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ohmyllm.tui.*"]
disable_error_code = ["attr-defined", "arg-type", "index", "operator", "misc", "assignment", "call-overload", "union-attr", "var-annotated"]
